<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spike-os | Agentic Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js for the 3D Brain Map -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
</head>
<body>
    <div id="brain-tooltip" class="brain-tooltip"></div>

    <!-- Ctrl+K command bar -->
    <div id="command-overlay" class="command-overlay" hidden>
        <div class="command-box">
            <input type="text" id="command-input" placeholder="Search your brain…" autocomplete="off">
            <div id="command-results" class="command-results"></div>
            <p class="command-hint"><kbd>Esc</kbd> to close</p>
        </div>
    </div>

    <nav class="sidebar">
        <div class="logo"><span class="logo-dot"></span>spike-os</div>

        <div class="search-container">
            <input type="text" id="global-search" placeholder="Search brain (#tags…)" autocomplete="off">
            <div id="search-results" class="search-results" hidden></div>
        </div>

        <div class="nav-links">
            <button class="nav-btn active" data-tab="sprints"><span>🚀</span> Sprints</button>
            <button class="nav-btn" data-tab="agents"><span>🤖</span> Agents</button>
            <button class="nav-btn" data-tab="links"><span>🔗</span> Links</button>
            <button class="nav-btn" data-tab="ideas"><span>💡</span> Ideas</button>
            <button class="nav-btn" data-tab="brain"><span>🧠</span> Brain</button>
            <button class="nav-btn" data-tab="chat"><span>💬</span> Chat</button>
        </div>

        <div class="theme-picker">
            <div id="theme-menu" class="theme-menu" hidden></div>
            <button id="theme-btn" class="theme-btn" type="button" aria-haspopup="true">🎨 Theme: Mission</button>
        </div>
        <p class="sidebar-hint"><kbd>Ctrl</kbd> + <kbd>K</kbd> to search</p>
    </nav>

    <main class="content">
        <section id="sprints" class="tab-content active">
            <header class="page-head">
                <h1>Sprint Board</h1>
                <p id="sprint-name" class="page-sub"></p>
            </header>
            <p class="hint">Click a task to move it to the next column.</p>
            <div id="sprint-board" class="sprint-board"></div>
        </section>

        <section id="agents" class="tab-content">
            <header class="page-head"><h1>Agent Team</h1></header>
            <div id="agent-list" class="grid"></div>
        </section>

        <section id="links" class="tab-content">
            <header class="page-head"><h1>Knowledge Links</h1></header>
            <div id="links-list" class="grid"></div>
        </section>

        <section id="ideas" class="tab-content">
            <header class="page-head"><h1>Ideas &amp; Brainstorming</h1></header>
            <div id="ideas-list" class="grid"></div>
        </section>

        <section id="brain" class="tab-content">
            <div class="brain-full-container">
                <div class="brain-sidebar">
                    <h2>Vault</h2>
                    <div id="vault-list" class="vault-list"></div>
                    <form id="note-form" class="note-editor">
                        <input type="text" id="note-title" placeholder="Note title…">
                        <textarea id="note-text" placeholder="Start writing… use [[links]] and #tags"></textarea>
                        <button type="submit">Save Note</button>
                        <p id="note-status" class="note-status"></p>
                    </form>
                </div>
                <div class="brain-visual">
                    <div id="brain-3d-container" class="brain-3d-canvas"></div>
                    <div id="note-overlay" class="note-overlay" hidden>
                        <div class="overlay-content">
                            <button id="close-note" class="close-btn" aria-label="Close">×</button>
                            <div id="overlay-body"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="chat" class="tab-content">
            <header class="page-head"><h1>System Chat</h1></header>
            <p class="hint">Runs Claude Code on your laptop inside spike-os. Answers can take a minute.</p>
            <div id="chat-window" class="chat-window"></div>
            <form id="chat-form" class="chat-input">
                <input type="text" id="chat-input" placeholder="Ask spike-os…" autocomplete="off">
                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
